name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Verify the published tarball actually contains dist/ and skills/,
      # and that it installs and runs cleanly outside this repo.
      - name: Verify packed tarball
        run: |
          npm pack
          mkdir -p /tmp/pack-test
          cd /tmp/pack-test
          npm init -y
          npm install "$GITHUB_WORKSPACE"/your-scope-agent-skills-*.tgz
          npx agent-skills --version
          npx agent-skills list
